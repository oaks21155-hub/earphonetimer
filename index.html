<!DOCTYPE html>
<html lang="ja" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>イヤホンタイマー - iOS Safari</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        iosBg: '#000000',
                        iosCard: '#1C1C1E',
                        iosCardSecondary: '#2C2C2E',
                        iosBorder: '#3A3A3C',
                        iosGrayText: '#8E8E93',
                        iosGreen: '#30D158',
                        iosGreenBg: '#073B14',
                        iosOrange: '#FF9F0A',
                        iosOrangeBg: '#3B2300',
                        iosRed: '#FF453A',
                        iosRedBg: '#3B0A08',
                        iosBlue: '#0A84FF',
                    },
                    fontFamily: {
                        ios: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* iOS App Touch & SafeArea Settings */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* 3D Drumroll Wheel Picker Mechanics */
        .picker-container {
            position: relative;
            height: 220px;
            perspective: 1000px;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        }

        .picker-column {
            height: 100%;
            position: relative;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        .picker-column::-webkit-scrollbar {
            display: none;
        }

        .picker-item {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 1.6rem;
            font-weight: 400;
            color: #8E8E93;
            transition: color 0.1s ease, transform 0.1s ease, opacity 0.1s ease;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .picker-item.selected {
            color: #FFFFFF;
            font-weight: 600;
            font-size: 1.85rem;
            opacity: 1;
        }

        .picker-selection-highlight {
            position: absolute;
            top: 88px; /* (220px - 44px) / 2 */
            left: 0;
            right: 0;
            height: 44px;
            background-color: rgba(118, 118, 128, 0.24);
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }

        /* Circular SVG Countdown Progress */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.25s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Screen Flash for Safety Visual Alarm */
        @keyframes flashAnimation {
            0%, 100% { background-color: #000000; }
            50% { background-color: #3B0A08; }
        }
        .alarm-flash {
            animation: flashAnimation 0.8s infinite;
        }

        /* Hide scrollbars for presets */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-black text-white h-full flex flex-col justify-between overflow-hidden select-none">

    <!-- TOP HEADER & EARPHONE STATUS BAR -->
    <header class="w-full px-5 pt-3 pb-2 flex flex-col gap-2 border-b border-iosCardSecondary/40">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold tracking-tight text-white">タイマー</h1>
            
            <!-- Earphone Audio Sound Test Button -->
            <button id="btn-sound-test" class="px-3.5 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosBlue font-medium flex items-center gap-1.5 transition border border-iosBlue/20">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                <span>イヤホンテスト</span>
            </button>
        </div>

        <!-- Earphone Device Audio Status Badge -->
        <div id="earphone-status-badge" class="w-full py-2 px-3.5 rounded-xl bg-iosCard flex items-center justify-between text-xs transition-colors duration-300">
            <div class="flex items-center gap-2">
                <span id="earphone-status-dot" class="w-2.5 h-2.5 rounded-full bg-iosOrange animate-pulse"></span>
                <span id="earphone-status-text" class="text-iosGrayText font-medium">イヤホン接続状態を確認中...</span>
            </div>
            <span id="earphone-mode-tag" class="px-2 py-0.5 rounded text-[10px] font-semibold bg-iosCardSecondary text-iosGrayText">検出中</span>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col justify-center items-center px-4 relative min-h-0">
        
        <!-- MODE 1: TIME WHEEL PICKER (IDLE STATE) -->
        <div id="picker-view" class="w-full max-w-sm flex flex-col items-center justify-center gap-4 my-auto">
            
            <!-- Quick Fine-Tune Adjustment (+ / - Touch Buttons) -->
            <div class="w-full grid grid-cols-3 gap-3 px-2 text-center text-xs text-iosGrayText font-medium">
                <div class="flex items-center justify-center gap-1">
                    <button onclick="adjustColumnValue('wheel-hours', -1)" class="w-7 h-7 rounded-full bg-iosCard active:bg-iosCardSecondary text-white font-bold text-sm flex items-center justify-center border border-iosBorder/40">－</button>
                    <span>時間</span>
                    <button onclick="adjustColumnValue('wheel-hours', 1)" class="w-7 h-7 rounded-full bg-iosCard active:bg-iosCardSecondary text-white font-bold text-sm flex items-center justify-center border border-iosBorder/40">＋</button>
                </div>
                <div class="flex items-center justify-center gap-1">
                    <button onclick="adjustColumnValue('wheel-minutes', -1)" class="w-7 h-7 rounded-full bg-iosCard active:bg-iosCardSecondary text-white font-bold text-sm flex items-center justify-center border border-iosBorder/40">－</button>
                    <span>分</span>
                    <button onclick="adjustColumnValue('wheel-minutes', 1)" class="w-7 h-7 rounded-full bg-iosCard active:bg-iosCardSecondary text-white font-bold text-sm flex items-center justify-center border border-iosBorder/40">＋</button>
                </div>
                <div class="flex items-center justify-center gap-1">
                    <button onclick="adjustColumnValue('wheel-seconds', -1)" class="w-7 h-7 rounded-full bg-iosCard active:bg-iosCardSecondary text-white font-bold text-sm flex items-center justify-center border border-iosBorder/40">－</button>
                    <span>秒</span>
                    <button onclick="adjustColumnValue('wheel-seconds', 1)" class="w-7 h-7 rounded-full bg-iosCard active:bg-iosCardSecondary text-white font-bold text-sm flex items-center justify-center border border-iosBorder/40">＋</button>
                </div>
            </div>

            <!-- iOS Drumroll Wheel Picker Box -->
            <div class="w-full picker-container px-1 flex items-center justify-around bg-iosCard/30 rounded-2xl border border-iosBorder/20">
                <div class="picker-selection-highlight"></div>

                <!-- Hours Column (0 to 23) -->
                <div class="flex-1 h-full relative">
                    <div id="wheel-hours" class="picker-column w-full text-center">
                        <!-- Dynamic Nodes Loaded via JS -->
                    </div>
                </div>

                <!-- Minutes Column (0 to 59) -->
                <div class="flex-1 h-full relative">
                    <div id="wheel-minutes" class="picker-column w-full text-center">
                        <!-- Dynamic Nodes Loaded via JS -->
                    </div>
                </div>

                <!-- Seconds Column (0 to 59) -->
                <div class="flex-1 h-full relative">
                    <div id="wheel-seconds" class="picker-column w-full text-center">
                        <!-- Dynamic Nodes Loaded via JS -->
                    </div>
                </div>
            </div>

            <!-- Quick Preset Chips -->
            <div class="w-full flex items-center justify-start sm:justify-center gap-2 overflow-x-auto py-1 px-1 no-scrollbar">
                <button onclick="setPresetTime(0, 0, 30)" class="px-3 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosGrayText hover:text-white font-medium border border-iosBorder/40 shrink-0 transition">30秒</button>
                <button onclick="setPresetTime(0, 1, 0)" class="px-3 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosGrayText hover:text-white font-medium border border-iosBorder/40 shrink-0 transition">1分</button>
                <button onclick="setPresetTime(0, 3, 0)" class="px-3 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosGrayText hover:text-white font-medium border border-iosBorder/40 shrink-0 transition">3分</button>
                <button onclick="setPresetTime(0, 5, 0)" class="px-3 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosGrayText hover:text-white font-medium border border-iosBorder/40 shrink-0 transition">5分</button>
                <button onclick="setPresetTime(0, 10, 0)" class="px-3 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosGrayText hover:text-white font-medium border border-iosBorder/40 shrink-0 transition">10分</button>
                <button onclick="setPresetTime(0, 15, 0)" class="px-3 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosGrayText hover:text-white font-medium border border-iosBorder/40 shrink-0 transition">15分</button>
                <button onclick="setPresetTime(0, 25, 0)" class="px-3 py-1.5 rounded-full bg-iosCard active:bg-iosCardSecondary text-xs text-iosOrange font-medium border border-iosOrange/30 shrink-0 transition">25分</button>
            </div>
        </div>

        <!-- MODE 2: COUNTDOWN DISPLAY (RUNNING / PAUSED STATE) -->
        <div id="timer-display-view" class="hidden w-full max-w-sm flex-col items-center justify-center my-auto relative py-4">
            <div class="relative w-72 h-72 flex items-center justify-center">
                <!-- Circular SVG Progress Ring -->
                <svg class="w-full h-full" viewBox="0 0 300 300">
                    <circle cx="150" cy="150" r="135" fill="none" stroke="#1C1C1E" stroke-width="8"/>
                    <circle id="progress-ring" class="progress-ring-circle" cx="150" cy="150" r="135" fill="none" stroke="#FF9F0A" stroke-width="8" stroke-dasharray="848.23" stroke-dashoffset="0" stroke-linecap="round"/>
                </svg>

                <!-- Digital Time Display -->
                <div class="absolute flex flex-col items-center justify-center">
                    <span id="countdown-text" class="text-5xl font-light tracking-tight font-mono text-white">00:00:00</span>
                    <div id="target-time-label" class="flex items-center gap-1.5 mt-3 text-xs text-iosGrayText font-medium">
                        <svg class="w-3.5 h-3.5 text-iosGrayText" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                        <span id="target-time-text">終了時間 --:--</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- SETTINGS & AUDIO CHIME SELECTOR -->
    <section class="w-full px-6 py-2 max-w-md mx-auto">
        <div class="bg-iosCard rounded-2xl p-3 flex flex-col gap-2.5 border border-iosBorder/30">
            <!-- Alarm Sound Selector -->
            <div class="flex items-center justify-between text-sm">
                <span class="text-iosGrayText font-medium">アラーム音</span>
                <select id="sound-select" class="bg-iosCardSecondary text-white text-xs px-3 py-1.5 rounded-lg border-none focus:ring-1 focus:ring-iosOrange outline-none cursor-pointer">
                    <option value="radar">レーダー (iOS標準風)</option>
                    <option value="chime">チャイム (和音)</option>
                    <option value="signal">シグナル (電子音)</option>
                    <option value="bell">クラシックベル</option>
                    <option value="mild">マイルド (静音・図書室用)</option>
                </select>
            </div>

            <!-- Earphone Speaker Protection Safety Toggle -->
            <div class="flex items-center justify-between text-sm pt-2 border-t border-iosCardSecondary/60">
                <div class="flex flex-col">
                    <span class="text-white font-medium text-xs">イヤホン外れ時スピーカー消音</span>
                    <span class="text-[10px] text-iosGrayText">未接続時はスピーカーを鳴らさず画面点滅/振動通知</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="mute-speaker-toggle" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-iosCardSecondary peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-iosGreen"></div>
                </label>
            </div>
        </div>
    </section>

    <!-- NATIVE IPHONE CIRCULAR CONTROL BUTTONS -->
    <footer class="w-full px-8 pb-8 pt-2 flex items-center justify-between max-w-md mx-auto">
        <!-- Left Button: Cancel / Reset -->
        <button id="btn-left" class="w-20 h-20 rounded-full bg-iosCardSecondary flex items-center justify-center transition active:scale-95 disabled:opacity-40" disabled>
            <div class="w-[74px] h-[74px] rounded-full border-2 border-black flex items-center justify-center">
                <span id="btn-left-text" class="text-iosGrayText font-medium text-base">キャンセル</span>
            </div>
        </button>

        <!-- Right Button: Start / Pause / Resume -->
        <button id="btn-right" class="w-20 h-20 rounded-full bg-iosGreenBg flex items-center justify-center transition active:scale-95">
            <div class="w-[74px] h-[74px] rounded-full border-2 border-black flex items-center justify-center">
                <span id="btn-right-text" class="text-iosGreen font-semibold text-base">開始</span>
            </div>
        </button>
    </footer>

    <!-- ALARM OVERLAY MODAL -->
    <div id="alarm-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden flex-col items-center justify-center z-50 px-6">
        <div class="w-full max-w-xs bg-iosCard rounded-3xl p-6 flex flex-col items-center text-center shadow-2xl border border-iosBorder/50">
            <div class="w-16 h-16 rounded-full bg-iosOrangeBg flex items-center justify-center mb-4 text-iosOrange">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-1">タイマー時間終了</h2>
            <p id="alarm-audio-status" class="text-xs text-iosGrayText mb-6">🎧 イヤホンで通知中</p>
            
            <button id="btn-stop-alarm" class="w-full py-3.5 bg-iosOrange active:bg-amber-600 text-black font-bold rounded-xl text-lg transition">
                停止
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT APPLICATION ENGINE -->
    <script>
        // -------------------------------------------------------------
        // APPLICATION STATE & CONSTANTS
        // -------------------------------------------------------------
        const TIMER_STATES = { IDLE: 'IDLE', RUNNING: 'RUNNING', PAUSED: 'PAUSED', ALARMING: 'ALARMING' };
        let currentState = TIMER_STATES.IDLE;

        // Selected Time Values
        const wheelValues = {
            'wheel-hours': 0,
            'wheel-minutes': 5,
            'wheel-seconds': 0
        };

        let totalDurationSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let targetEndTime = null;

        let wakeLock = null;
        let audioCtx = null;
        let alarmIntervalId = null;
        let isEarphoneConnected = false;

        // Element Caches
        const pickerView = document.getElementById('picker-view');
        const timerDisplayView = document.getElementById('timer-display-view');
        const countdownText = document.getElementById('countdown-text');
        const targetTimeText = document.getElementById('target-time-text');
        const progressRing = document.getElementById('progress-ring');

        const btnLeft = document.getElementById('btn-left');
        const btnLeftText = document.getElementById('btn-left-text');
        const btnRight = document.getElementById('btn-right');
        const btnRightText = document.getElementById('btn-right-text');

        const earphoneBadge = document.getElementById('earphone-status-badge');
        const earphoneDot = document.getElementById('earphone-status-dot');
        const earphoneText = document.getElementById('earphone-status-text');
        const earphoneTag = document.getElementById('earphone-mode-tag');
        const muteSpeakerToggle = document.getElementById('mute-speaker-toggle');

        const alarmOverlay = document.getElementById('alarm-overlay');
        const btnStopAlarm = document.getElementById('btn-stop-alarm');

        // -------------------------------------------------------------
        // TOUCH & DRAG WHEEL PICKER ENGINE
        // -------------------------------------------------------------
        const columnsData = {
            'wheel-hours': { max: 24, label: '時間' },
            'wheel-minutes': { max: 60, label: '分' },
            'wheel-seconds': { max: 60, label: '秒' }
        };

        function buildWheelColumns() {
            Object.keys(columnsData).forEach(colId => {
                const colEl = document.getElementById(colId);
                const maxCount = columnsData[colId].max;
                const label = columnsData[colId].label;
                const initialVal = wheelValues[colId];

                colEl.innerHTML = '';

                // Top Buffer Padding
                const topPad = document.createElement('div');
                topPad.style.height = '88px';
                topPad.className = 'shrink-0';
                colEl.appendChild(topPad);

                const itemEls = [];

                for (let i = 0; i < maxCount; i++) {
                    const item = document.createElement('div');
                    item.className = `picker-item ${i === initialVal ? 'selected' : ''}`;
                    item.textContent = `${i.toString().padStart(2, '0')} ${label}`;
                    item.setAttribute('data-val', i);

                    // Click/Tap on item to select directly
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        scrollToValue(colId, i);
                    });

                    colEl.appendChild(item);
                    itemEls.push(item);
                }

                // Bottom Buffer Padding
                const botPad = document.createElement('div');
                botPad.style.height = '88px';
                botPad.className = 'shrink-0';
                colEl.appendChild(botPad);

                // Scroll Position & Touch Drag Listeners
                setupWheelInteractions(colEl, colId, maxCount, itemEls);

                // Initial Position Sync
                setTimeout(() => {
                    colEl.scrollTop = initialVal * 44;
                    update3DEffect(colEl, itemEls);
                }, 60);
            });
        }

        function setupWheelInteractions(colEl, colId, maxCount, itemEls) {
            let isDragging = false;
            let startY = 0;
            let startScrollTop = 0;
            let scrollDebounce = null;

            // Mouse Drag Support
            colEl.addEventListener('mousedown', (e) => {
                isDragging = true;
                startY = e.pageY;
                startScrollTop = colEl.scrollTop;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const walk = (e.pageY - startY) * 1.2;
                colEl.scrollTop = startScrollTop - walk;
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    snapToNearest(colEl, colId, maxCount, itemEls);
                }
            });

            // Touch Drag / Scroll Listener
            colEl.addEventListener('scroll', () => {
                update3DEffect(colEl, itemEls);

                clearTimeout(scrollDebounce);
                scrollDebounce = setTimeout(() => {
                    snapToNearest(colEl, colId, maxCount, itemEls);
                }, 90);
            });
        }

        function update3DEffect(colEl, itemEls) {
            const scrollTop = colEl.scrollTop;
            const selectedIdx = Math.min(itemEls.length - 1, Math.max(0, Math.round(scrollTop / 44)));

            itemEls.forEach((item, idx) => {
                const distance = idx - (scrollTop / 44);
                const absDist = Math.abs(distance);

                if (absDist < 0.5) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }

                // Apply 3D Curved Perspective
                const rotateX = Math.max(-60, Math.min(60, distance * -18));
                const scale = Math.max(0.7, 1 - absDist * 0.12);
                const opacity = Math.max(0.25, 1 - absDist * 0.28);

                item.style.transform = `rotateX(${rotateX}deg) scale(${scale})`;
                item.style.opacity = opacity;
            });
        }

        function snapToNearest(colEl, colId, maxCount, itemEls) {
            const index = Math.min(maxCount - 1, Math.max(0, Math.round(colEl.scrollTop / 44)));
            if (wheelValues[colId] !== index) {
                wheelValues[colId] = index;
                triggerHaptic();
            }
        }

        function scrollToValue(colId, val) {
            const colEl = document.getElementById(colId);
            const maxCount = columnsData[colId].max;
            const targetVal = Math.min(maxCount - 1, Math.max(0, val));

            wheelValues[colId] = targetVal;
            colEl.scrollTo({ top: targetVal * 44, behavior: 'smooth' });
            triggerHaptic();
        }

        function adjustColumnValue(colId, delta) {
            const currentVal = wheelValues[colId];
            const maxVal = columnsData[colId].max;
            let newVal = currentVal + delta;
            
            if (newVal < 0) newVal = maxVal - 1;
            if (newVal >= maxVal) newVal = 0;

            scrollToValue(colId, newVal);
        }

        function setPresetTime(h, m, s) {
            scrollToValue('wheel-hours', h);
            scrollToValue('wheel-minutes', m);
            scrollToValue('wheel-seconds', s);
        }

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        // -------------------------------------------------------------
        // WEB AUDIO ENGINE & EARPHONE DETECTION
        // -------------------------------------------------------------
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        async function checkEarphoneConnection() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                updateEarphoneUI(false, "オーディオデバイス確認中 (安全モード)");
                return;
            }

            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const hasHeadphones = devices.some(device => {
                    const label = device.label.toLowerCase();
                    return label.includes('headphone') || 
                           label.includes('headset') || 
                           label.includes('airpods') || 
                           label.includes('bluetooth') ||
                           label.includes('イヤホン') ||
                           label.includes('ヘッドホン');
                });

                if (hasHeadphones) {
                    isEarphoneConnected = true;
                    updateEarphoneUI(true, "🎧 イヤホン接続完了 (イヤホンのみ出力)");
                } else {
                    isEarphoneConnected = false;
                    updateEarphoneUI(false, "⚠️ イヤホン未検出 (消音・バイブモード)");
                }
            } catch (err) {
                updateEarphoneUI(false, "🎧 オーディオ出力準備中");
            }
        }

        function updateEarphoneUI(isConnected, textMessage) {
            if (isConnected) {
                earphoneDot.className = "w-2.5 h-2.5 rounded-full bg-iosGreen";
                earphoneBadge.className = "w-full py-2 px-3.5 rounded-xl bg-iosGreenBg/40 border border-iosGreen/30 flex items-center justify-between text-xs transition-colors duration-300";
                earphoneText.className = "text-iosGreen font-medium";
                earphoneText.textContent = textMessage;
                earphoneTag.className = "px-2 py-0.5 rounded text-[10px] font-semibold bg-iosGreen/20 text-iosGreen";
                earphoneTag.textContent = "イヤホン出力";
            } else {
                earphoneDot.className = "w-2.5 h-2.5 rounded-full bg-iosOrange animate-pulse";
                earphoneBadge.className = "w-full py-2 px-3.5 rounded-xl bg-iosOrangeBg/40 border border-iosOrange/30 flex items-center justify-between text-xs transition-colors duration-300";
                earphoneText.className = "text-iosOrange font-medium";
                earphoneText.textContent = textMessage;
                earphoneTag.className = "px-2 py-0.5 rounded text-[10px] font-semibold bg-iosOrange/20 text-iosOrange";
                earphoneTag.textContent = "消音/振動";
            }
        }

        function playTonePreset(soundType, isTest = false) {
            initAudioContext();
            if (!audioCtx) return;

            const muteSpeaker = muteSpeakerToggle.checked;
            if (muteSpeaker && !isEarphoneConnected && !isTest) {
                return; // Mute speaker safety trigger
            }

            const now = audioCtx.currentTime;

            if (soundType === 'radar') {
                playBeep(1046.5, now, 0.12, 0.3);
                playBeep(1318.5, now + 0.15, 0.18, 0.3);
            } else if (soundType === 'chime') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                    playBellTone(freq, now + idx * 0.08, 0.8);
                });
            } else if (soundType === 'signal') {
                playBeep(2093.0, now, 0.1, 0.25);
                playBeep(2093.0, now + 0.15, 0.1, 0.25);
            } else if (soundType === 'bell') {
                playBellTone(880, now, 1.2);
            } else if (soundType === 'mild') {
                playBeep(440.0, now, 0.25, 0.15);
                playBeep(554.37, now + 0.25, 0.3, 0.15);
            }
        }

        function playBeep(freq, startTime, duration, vol = 0.2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playBellTone(freq, startTime, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0.3, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function startAlarmSoundLoop() {
            const soundPreset = document.getElementById('sound-select').value;
            playTonePreset(soundPreset);

            alarmIntervalId = setInterval(() => {
                playTonePreset(soundPreset);
                if (navigator.vibrate) {
                    navigator.vibrate([300, 150, 300, 150, 400]);
                }
            }, 1500);
        }

        function stopAlarmSoundLoop() {
            if (alarmIntervalId) {
                clearInterval(alarmIntervalId);
                alarmIntervalId = null;
            }
        }

        // -------------------------------------------------------------
        // TIMER LOGIC & COUNTDOWN ENGINE
        // -------------------------------------------------------------
        function startTimer() {
            initAudioContext();
            requestWakeLock();

            if (currentState === TIMER_STATES.IDLE) {
                totalDurationSeconds = (wheelValues['wheel-hours'] * 3600) + (wheelValues['wheel-minutes'] * 60) + wheelValues['wheel-seconds'];
                if (totalDurationSeconds <= 0) return;
                remainingSeconds = totalDurationSeconds;
            }

            currentState = TIMER_STATES.RUNNING;
            targetEndTime = Date.now() + (remainingSeconds * 1000);

            // Calculate finish time
            const finishDate = new Date(targetEndTime);
            const hoursStr = finishDate.getHours().toString().padStart(2, '0');
            const minsStr = finishDate.getMinutes().toString().padStart(2, '0');
            targetTimeText.textContent = `終了時間 ${hoursStr}:${minsStr}`;

            // Switch Screen Views
            pickerView.classList.add('hidden');
            timerDisplayView.classList.remove('hidden');
            timerDisplayView.classList.add('flex');

            updateUIState();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(tick, 250);
            tick();
        }

        function pauseTimer() {
            currentState = TIMER_STATES.PAUSED;
            if (timerInterval) clearInterval(timerInterval);
            updateUIState();
        }

        function cancelTimer() {
            currentState = TIMER_STATES.IDLE;
            if (timerInterval) clearInterval(timerInterval);
            releaseWakeLock();

            timerDisplayView.classList.add('hidden');
            timerDisplayView.classList.remove('flex');
            pickerView.classList.remove('hidden');

            updateUIState();
        }

        function tick() {
            if (currentState !== TIMER_STATES.RUNNING) return;

            const now = Date.now();
            const diffMs = targetEndTime - now;
            remainingSeconds = Math.max(0, Math.ceil(diffMs / 1000));

            updateDisplay(remainingSeconds);

            if (remainingSeconds <= 0) {
                finishTimer();
            }
        }

        function finishTimer() {
            currentState = TIMER_STATES.ALARMING;
            if (timerInterval) clearInterval(timerInterval);

            document.body.classList.add('alarm-flash');
            alarmOverlay.classList.remove('hidden');
            alarmOverlay.classList.add('flex');

            document.getElementById('alarm-audio-status').textContent = isEarphoneConnected 
                ? "🎧 イヤホンで通知中" 
                : "⚠️ イヤホン未検出のため無音/振動通知";

            startAlarmSoundLoop();
        }

        function stopAlarm() {
            stopAlarmSoundLoop();
            document.body.classList.remove('alarm-flash');
            alarmOverlay.classList.add('hidden');
            alarmOverlay.classList.remove('flex');
            cancelTimer();
        }

        function updateDisplay(secondsTotal) {
            const hrs = Math.floor(secondsTotal / 3600);
            const mins = Math.floor((secondsTotal % 3600) / 60);
            const secs = secondsTotal % 60;

            countdownText.textContent = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            // Circle Progress Ring
            const circumference = 2 * Math.PI * 135;
            const progressRatio = totalDurationSeconds > 0 ? remainingSeconds / totalDurationSeconds : 0;
            progressRing.style.strokeDashoffset = circumference * (1 - progressRatio);
        }

        function updateUIState() {
            if (currentState === TIMER_STATES.IDLE) {
                btnLeft.disabled = true;
                btnLeft.className = "w-20 h-20 rounded-full bg-iosCardSecondary flex items-center justify-center transition opacity-40 cursor-not-allowed";
                btnLeftText.className = "text-iosGrayText font-medium text-base";

                btnRight.className = "w-20 h-20 rounded-full bg-iosGreenBg flex items-center justify-center transition active:scale-95";
                btnRightText.className = "text-iosGreen font-semibold text-base";
                btnRightText.textContent = "開始";
            } 
            else if (currentState === TIMER_STATES.RUNNING) {
                btnLeft.disabled = false;
                btnLeft.className = "w-20 h-20 rounded-full bg-iosCardSecondary flex items-center justify-center transition active:scale-95";
                btnLeftText.className = "text-white font-medium text-base";

                btnRight.className = "w-20 h-20 rounded-full bg-iosOrangeBg flex items-center justify-center transition active:scale-95";
                btnRightText.className = "text-iosOrange font-semibold text-base";
                btnRightText.textContent = "一時停止";
            } 
            else if (currentState === TIMER_STATES.PAUSED) {
                btnLeft.disabled = false;
                btnLeft.className = "w-20 h-20 rounded-full bg-iosCardSecondary flex items-center justify-center transition active:scale-95";
                btnLeftText.className = "text-white font-medium text-base";

                btnRight.className = "w-20 h-20 rounded-full bg-iosGreenBg flex items-center justify-center transition active:scale-95";
                btnRightText.className = "text-iosGreen font-semibold text-base";
                btnRightText.textContent = "再開";
            }
        }

        // -------------------------------------------------------------
        // SAFARI WAKE LOCK
        // -------------------------------------------------------------
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock error:", err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // -------------------------------------------------------------
        // INIT & LISTENERS
        // -------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            buildWheelColumns();
            checkEarphoneConnection();

            if (navigator.mediaDevices && navigator.mediaDevices.ondevicechange !== undefined) {
                navigator.mediaDevices.ondevicechange = checkEarphoneConnection;
            }

            btnRight.addEventListener('click', () => {
                triggerHaptic();
                if (currentState === TIMER_STATES.IDLE || currentState === TIMER_STATES.PAUSED) {
                    startTimer();
                } else if (currentState === TIMER_STATES.RUNNING) {
                    pauseTimer();
                }
            });

            btnLeft.addEventListener('click', () => {
                triggerHaptic();
                if (currentState !== TIMER_STATES.IDLE) {
                    cancelTimer();
                }
            });

            btnStopAlarm.addEventListener('click', () => {
                triggerHaptic();
                stopAlarm();
            });

            document.getElementById('btn-sound-test').addEventListener('click', () => {
                triggerHaptic();
                const soundPreset = document.getElementById('sound-select').value;
                playTonePreset(soundPreset, true);
            });

            document.body.addEventListener('touchstart', initAudioContext, { once: true });
            document.body.addEventListener('click', initAudioContext, { once: true });
        });
    </script>
</body>
